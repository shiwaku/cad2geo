[workspace]
resolver = "3"
members = ["crates/core", "crates/read", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/shiwaku/cad2geojson"

[workspace.dependencies]
cad2geojson-core = { path = "crates/core" }
cad2geojson-read = { path = "crates/read" }
proj4rs = { version = "0.2.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
